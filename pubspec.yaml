environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.3.0
  material_ui: ^1.0.0
  vector_graphics: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

