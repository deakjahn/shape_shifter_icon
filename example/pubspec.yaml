name: shape_shifter_icon_example
description: Demonstrates how to use the shape_shifter_icon package.
version: 2.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  shape_shifter_icon: ^1.0.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  material_ui: ^1.0.0
  vector_graphics_compiler: ^1.2.5

dependency_overrides:
  shape_shifter_icon:
    path: ../

flutter:
  uses-material-design: true

  assets:
    - assets/